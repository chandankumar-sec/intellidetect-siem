title: Scheduled Task Created From Command Line
id: 0d677134-4b10-5390-a878-a204ab9fdb98
name: IDT-SG-007
status: stable
description: |
    schtasks /create is a common persistence mechanism. Review the task action and the parent process.
author: Chandan Kumar
date: 2026/09/30
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
falsepositives:
    - Software installers and IT automation
level: medium
